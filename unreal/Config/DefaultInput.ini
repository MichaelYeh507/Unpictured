[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; The pawn adds degrees to the view itself, so the legacy yaw and pitch scales stay off.
bEnableLegacyInputScales=False
; The mouse is captured only while a button is held: that is the drag that looks around.
; Not at launch either, so the cursor is free until the first drag.
DefaultViewportMouseCaptureMode=CaptureDuringMouseDown
DefaultViewportMouseLockMode=LockOnCapture
bCaptureMouseOnLaunch=False
